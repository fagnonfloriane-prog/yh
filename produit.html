<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produit — Flori's Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;color:#1A1A1A;background:#fff;line-height:1.7}
    h1,h2,h3,h4{font-family:'Playfair Display',Georgia,serif;font-weight:600;line-height:1.25}
    a{text-decoration:none;color:inherit}
    .container{max-width:1100px;margin:0 auto;padding:0 24px}
    .btn{display:inline-block;padding:14px 36px;font-family:'Inter',sans-serif;font-weight:600;font-size:.9rem;letter-spacing:.5px;text-transform:uppercase;border:none;cursor:pointer;transition:all .3s}
    .btn-gold{background:#D4AF37;color:#fff}
    .btn-gold:hover{background:#b8941f;transform:translateY(-2px);box-shadow:0 4px 15px rgba(212,175,55,.4)}
    .btn-outline{background:transparent;border:1.5px solid #1A1A1A;color:#1A1A1A}
    .btn-outline:hover{background:#1A1A1A;color:#fff}
    .gold{color:#D4AF37}

    /* HEADER */
    .header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-bottom:1px solid #eee}
    .nav{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;max-width:1200px;margin:0 auto}
    .logo{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:700;letter-spacing:1px}
    .logo span{color:#D4AF37}
    .nav-links{display:flex;gap:28px;align-items:center}
    .nav-links a{font-size:.85rem;font-weight:500;text-transform:uppercase;letter-spacing:1px;position:relative}
    .nav-links a::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:2px;background:#D4AF37;transition:width .3s}
    .nav-links a:hover::after{width:100%}
    .nav-icons{display:flex;gap:16px;align-items:center}
    .nav-icons a{position:relative}
    .cart-count{position:absolute;top:-8px;right:-10px;background:#D4AF37;color:#fff;font-size:.6rem;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
    .hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer}
    .hamburger span{width:24px;height:2px;background:#1A1A1A}

    /* PRODUCT DETAIL */
    .product-detail{padding:50px 0 80px}
    .product-layout{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
    .product-gallery{background:#f9f9f9;border-radius:16px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
    .product-gallery svg{width:55%;height:55%;opacity:.7}
    .product-gallery .tag{position:absolute;top:16px;left:16px;padding:4px 12px;background:#D4AF37;color:#fff;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;border-radius:4px}
    .product-info-detail h1{font-size:2rem;margin-bottom:8px}
    .product-info-detail .brand{font-size:.78rem;text-transform:uppercase;letter-spacing:3px;color:#999;margin-bottom:6px}
    .product-info-detail .price{font-size:1.6rem;font-weight:700;margin-bottom:6px}
    .product-info-detail .old-price{text-decoration:line-through;color:#bbb;font-size:1rem;margin-left:12px}
    .product-info-detail .stock{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:#2e7d32;margin-bottom:20px;padding:4px 12px;background:#f0faf0;border-radius:4px}
    .product-info-detail .stock::before{content:'';width:6px;height:6px;background:#2e7d32;border-radius:50%}
    .product-info-detail .desc{color:#666;font-size:.9rem;margin-bottom:24px;line-height:1.8}
    .product-meta{margin-bottom:24px}
    .meta-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:.82rem}
    .meta-item .label{color:#999;text-transform:uppercase;letter-spacing:1px;font-size:.72rem}
    .size-selector{display:flex;gap:10px;margin-bottom:24px}
    .size-btn{padding:8px 20px;border:1px solid #ddd;border-radius:6px;font-size:.82rem;cursor:pointer;transition:all .3s;background:#fff}
    .size-btn:hover,.size-btn.active{background:#1A1A1A;color:#fff;border-color:#1A1A1A}
    .qty-row{display:flex;align-items:center;gap:16px;margin-bottom:24px}
    .qty-control{display:flex;align-items:center;border:1px solid #ddd;border-radius:6px;overflow:hidden}
    .qty-control button{width:36px;height:36px;border:none;background:#f9f9f9;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center}
    .qty-control button:hover{background:#eee}
    .qty-control span{padding:0 14px;font-size:.9rem;font-weight:600;min-width:36px;text-align:center}
    .action-buttons{display:flex;gap:12px;margin-bottom:24px}
    .action-buttons .btn{flex:1;text-align:center}
    .whatsapp-order{display:flex;align-items:center;gap:8px;padding:12px;background:#f0faf0;border:1px solid #c8e6c9;border-radius:8px;font-size:.82rem;color:#2e7d32;cursor:pointer;transition:all .3s;margin-bottom:24px}
    .whatsapp-order:hover{background:#e8f5e9}

    /* RELATED */
    .related-section{padding:60px 0;background:#F9F9F9}
    .related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
    .product-card{background:#fff;border:1px solid #f0f0f0;border-radius:12px;overflow:hidden;transition:all .35s;cursor:pointer}
    .product-card:hover{transform:translateY(-4px);box-shadow:0 8px 30px rgba(0,0,0,.06)}
    .product-card .p-img{aspect-ratio:1;background:#f9f9f9;display:flex;align-items:center;justify-content:center}
    .product-card .p-img svg{width:55%;height:55%;opacity:.5}
    .product-card .p-info{padding:14px 16px}
    .product-card .p-brand{font-size:.7rem;text-transform:uppercase;letter-spacing:2px;color:#999}
    .product-card .p-name{font-family:'Playfair Display',serif;font-size:.95rem;margin:4px 0}
    .product-card .p-price{font-weight:700;font-size:1rem}

    /* FOOTER */
    .footer{background:#1A1A1A;color:#ccc;padding:40px 0;text-align:center}
    .footer p{font-size:.78rem;color:#666}

    /* WHATSAPP */
    .whatsapp-float{position:fixed;bottom:24px;right:24px;z-index:999;width:60px;height:60px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(37,211,102,.4);transition:transform .3s}
    .whatsapp-float:hover{transform:scale(1.1)}
    .whatsapp-float svg{width:28px;height:28px;fill:#fff}

    .mobile-menu{display:none;position:fixed;inset:0;z-index:200;background:rgba(255,255,255,.98);flex-direction:column;align-items:center;justify-content:center;gap:24px}
    .mobile-menu.active{display:flex}
    .mobile-menu a{font-size:1.2rem;font-family:'Playfair Display',serif}
    .mobile-close{position:absolute;top:20px;right:24px;font-size:1.6rem;cursor:pointer}

    .breadcrumb{display:flex;gap:8px;font-size:.78rem;color:#aaa;margin-bottom:24px}
    .breadcrumb a{color:#999}.breadcrumb a:hover{color:#D4AF37}

    @media(max-width:768px){
      .nav-links{display:none}.hamburger{display:flex}
      .product-layout{grid-template-columns:1fr;gap:24px}
      .product-info-detail h1{font-size:1.5rem}
      .action-buttons{flex-direction:column}
    }
  </style>
</head>
<body>
  <header class="header">
    <nav class="nav">
      <a href="index.html" class="logo">Flori's <span>Market</span></a>
      <div class="nav-links">
        <a href="index.html">Accueil</a>
        <a href="boutique.html">Boutique</a>
        <a href="a-propos.html">À Propos</a>
        <a href="contact.html">Contact</a>
      </div>
      <div class="nav-icons">
        <a href="panier.html" aria-label="Panier">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
          <span class="cart-count" id="cartCount">0</span>
        </a>
        <div class="hamburger" onclick="toggleMobile()"><span></span><span></span><span></span></div>
      </div>
    </nav>
  </header>

  <div class="mobile-menu" id="mobileMenu">
    <div class="mobile-close" onclick="toggleMobile()">&times;</div>
    <a href="index.html">Accueil</a><a href="boutique.html">Boutique</a><a href="a-propos.html">À Propos</a><a href="contact.html">Contact</a><a href="panier.html">Panier</a>
  </div>

  <section class="product-detail">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Accueil</a><span>/</span><a href="boutique.html">Boutique</a><span>/</span><span id="bcName">Produit</span></div>
      <div class="product-layout">
        <div class="product-gallery" id="gallery">
          <!-- filled by JS -->
        </div>
        <div class="product-info-detail" id="productInfo">
          <!-- filled by JS -->
        </div>
      </div>
    </div>
  </section>

  <!-- RELATED -->
  <section class="related-section">
    <div class="container">
      <h2 style="text-align:center;font-size:1.6rem;margin-bottom:36px">Vous Aimerez <span class="gold">Aussi</span></h2>
      <div class="related-grid" id="relatedGrid">
        <!-- filled by JS -->
      </div>
    </div>
  </section>

  <footer class="footer"><p>© 2026 Flori's Market — Tous droits réservés</p></footer>

  <a href="https://wa.me/22990000000" class="whatsapp-float" target="_blank" aria-label="WhatsApp">
    <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.875.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.88 11.88 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
  </a>

  <script>
    const products={
      1:{name:'Sauvage Eau de Parfum',brand:'Dior',price:35000,size:'100ml',genre:'Homme',tag:'Best-seller',desc:'Un parfum masculin puissant et authentique. Sauvage est une composition audacieuse qui marque les sens avec ses notes de bergamote, poivre de Sichuan et ambroxan. Une fragrance sauvage et noble.',notes:{tête:'Bergamote, Poivre de Sichuan',cœur:'Lavande, Poivre noir, Estragon',fond:'Ambroxan, Cèdre, Labdanum'},svg:'<svg viewBox="0 0 120 180" fill="none"><defs><linearGradient id="p1" x1="60" y1="0" x2="60" y2="180"><stop offset="0%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#b8941f"/></linearGradient></defs><rect x="30" y="50" width="60" height="120" rx="8" fill="url(#p1)" opacity=".7"/><rect x="40" y="30" width="40" height="25" rx="4" fill="#1A1A1A" opacity=".15"/><rect x="50" y="10" width="20" height="24" rx="3" fill="#1A1A1A" opacity=".2"/><rect x="56" y="4" width="8" height="8" rx="4" fill="#1A1A1A" opacity=".25"/></svg>'},
      2:{name:'Bleu de Chanel Parfum',brand:'Chanel',price:38000,size:'100ml',genre:'Homme',tag:'Nouveau',desc:'La quintessence de l'élégance masculine. Bleu de Chanel Parfum est une fragrance boisée et ambrée, intense et raffinée, qui révèle un charisme profond et une allure affirmée.',notes:{tête:'Citron, Bergamote, Menthe',cœur:'Gingembre, Jasmin, Cèdre',fond:'Santal, Patchouli, Vétiver'},svg:'<svg viewBox="0 0 120 180" fill="none"><defs><linearGradient id="p2" x1="60" y1="0" x2="60" y2="180"><stop offset="0%" stop-color="#4a6fa5"/><stop offset="100%" stop-color="#2c4a7a"/></linearGradient></defs><rect x="30" y="50" width="60" height="120" rx="12" fill="url(#p2)" opacity=".6"/><rect x="45" y="28" width="30" height="28" rx="6" fill="#1A1A1A" opacity=".12"/><circle cx="60" cy="14" r="8" fill="#1A1A1A" opacity=".15"/></svg>'},
      3:{name:'Mon Paris Eau de Parfum',brand:'Yves Saint Laurent',price:28000,oldPrice:32000,size:'50ml',genre:'Femme',tag:'Promo',desc:'Une déclaration d'amour à Paris. Mon Paris est un parfum féminin vibrant et romantique, un bouquet de fleurs blanches illuminé par la framboise et la poire, sur un fond de musc blanc et patchouli.',notes:{tête:'Framboise, Poire, Bergamote',cœur:'Fleur d'oranger, Jasmin, Péonie',fond:'Musc blanc, Patchouli, Cristal de musc'},svg:'<svg viewBox="0 0 120 180" fill="none"><defs><linearGradient id="p3" x1="60" y1="0" x2="60" y2="180"><stop offset="0%" stop-color="#f0d0e0"/><stop offset="100%" stop-color="#c88aa0"/></linearGradient></defs><rect x="25" y="50" width="70" height="115" rx="20" fill="url(#p3)" opacity=".7"/><rect x="42" y="30" width="36" height="24" rx="12" fill="#1A1A1A" opacity=".12"/><rect x="54" y="8" width="12" height="26" rx="6" fill="#1A1A1A" opacity=".15"/></svg>'},
      4:{name:'Oud Wood Eau de Parfum',brand:'Tom Ford',price:45000,size:'50ml',genre:'Unisexe',desc:'Un oud rare et précieux, adouci par la rose et le cardamome. Oud Wood de Tom Ford est un voyage olfactif au cœur des bois les plus nobles, une fragrance d'une sophistication absolue.',notes:{tête:'Cardamome, Rose, Poivre de Sichuan',cœur:'Oud, Bois de santal, Patchouli',fond:'Vétiver, Tonka, Ambre'},svg:'<svg viewBox="0 0 120 180" fill="none"><defs><linearGradient id="p4" x1="60" y1="0" x2="60" y2="180"><stop offset="0%" stop-color="#3a3a3a"/><stop offset="100%" stop-color="#1A1A1A"/></linearGradient></defs><rect x="30" y="55" width="60" height="110" rx="4" fill="url(#p4)" opacity=".6"/><rect x="42" y="32" width="36" height="28" rx="2" fill="#333" opacity=".5"/><rect x="50" y="12" width="20" height="24" rx="2" fill="#333" opacity=".4"/><rect x="55" y="5" width="10" height="10" rx="2" fill="#333" opacity=".4"/></svg>'}
    };

    function getCart(){return JSON.parse(localStorage.getItem('floris_cart')||'[]')}
    function saveCart(c){localStorage.setItem('floris_cart',JSON.stringify(c));updateCount()}
    function addToCart(name,price){const c=getCart();c.push({name,price,q:1});saveCart(c);showToast(name+' ajouté au panier !')}
    function updateCount(){document.getElementById('cartCount').textContent=getCart().length}
    function showToast(msg){const t=document.createElement('div');t.textContent=msg;Object.assign(t.style,{position:'fixed',bottom:'100px',right:'24px',background:'#1A1A1A',color:'#fff',padding:'14px 24px',borderRadius:'8px',fontSize:'85rem',zIndex:'9999',opacity:'0',transition:'opacity .3s'});document.body.appendChild(t);setTimeout(()=>t.style.opacity='1',10);setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300)},2500)}

    let qty=1;
    function changeQty(d){qty=Math.max(1,qty+d);document.getElementById('qtyVal').textContent=qty}

    // Load product
    const params=new URLSearchParams(window.location.search);
    const pid=params.get('id')||'1';
    const p=products[pid]||products[1];

    document.getElementById('bcName').textContent=p.name;
    document.getElementById('gallery').innerHTML=(p.tag?`<span class="tag">${p.tag}</span>`:'')+p.svg;

    let html=`
      <div class="brand">${p.brand}</div>
      <h1>${p.name}</h1>
      <div class="price">${p.price.toLocaleString('fr-FR')} FCFA${p.oldPrice?' <span class="old-price">'+p.oldPrice.toLocaleString('fr-FR')+' FCFA</span>':''}</div>
      <div class="stock">En stock — Livraison express disponible</div>
      <p class="desc">${p.desc}</p>
      <div class="product-meta">
        <div class="meta-item"><span class="label">Genre</span><span>${p.genre}</span></div>
        <div class="meta-item"><span class="label">Contenance</span><span>${p.size}</span></div>
        <div class="meta-item"><span class="label">Famille olfactive</span><span>Boisé ${p.genre==='Femme'?'Floral':'Épicé'}</span></div>
      </div>
      <h4 style="font-size:.9rem;margin-bottom:8px">Notes Olfactives</h4>
      <div class="meta-item"><span class="label">Tête</span><span>${p.notes.tête}</span></div>
      <div class="meta-item"><span class="label">Cœur</span><span>${p.notes.cœur}</span></div>
      <div class="meta-item" style="border:none"><span class="label">Fond</span><span>${p.notes.fond}</span></div>
      <div class="qty-row"><span style="font-size:.82rem;color:#888">Quantité :</span><div class="qty-control"><button onclick="changeQty(-1)">−</button><span id="qtyVal">1</span><button onclick="changeQty(1)">+</button></div></div>
      <div class="action-buttons">
        <button class="btn btn-gold" onclick="addToCart('${p.name}',${p.price})">Ajouter au Panier</button>
        <button class="btn btn-outline" onclick="window.location='https://wa.me/22990000000?text=Bonjour, je souhaite commander ${encodeURIComponent(p.name)}'">Commander via WhatsApp</button>
      </div>
      <div class="whatsapp-order" onclick="window.location='https://wa.me/22990000000?text=Bonjour, je souhaite commander ${encodeURIComponent(p.name)}'">
        💬 Besoin de conseil ? Commandez directement sur WhatsApp
      </div>
    `;
    document.getElementById('productInfo').innerHTML=html;

    // Related
    const related=Object.entries(products).filter(([k])=>k!==pid).slice(0,3);
    let relatedHtml='';
    related.forEach(([k,v])=>{
      relatedHtml+=`<div class="product-card" onclick="window.location='produit.html?id=${k}'">
        <div class="p-img">${v.svg}</div>
        <div class="p-info"><div class="p-brand">${v.brand}</div><div class="p-name">${v.name}</div><div class="p-price">${v.price.toLocaleString('fr-FR')} FCFA</div></div>
      </div>`;
    });
    document.getElementById('relatedGrid').innerHTML=relatedHtml;

    updateCount();
    function toggleMobile(){document.getElementById('mobileMenu').classList.toggle('active')}
  </script>
</body>
</html>
